<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff4df">
  <meta name="description" content="Sweet Potato — 地瓜投擲遊戲。">
  <title>Sweet Potato</title>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/game.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <main id="game" class="game">
    <canvas id="game-canvas" aria-label="地瓜投擲遊戲畫面"></canvas>
    <div class="toolbar">
      <span class="game-name">Sweet Potato</span>
      <div class="toolbar-actions">
        <button id="change-background" type="button">重新選擇背景</button>
      </div>
    </div>
    <input id="background-file" type="file" accept="image/jpeg,image/png,image/webp" hidden>
    <p id="hint" class="hint" aria-live="polite">點擊畫面投擲地瓜，按住可連續投擲</p>
  </main>
  <script type="module" src="js/main.js"></script>
</body>
</html>
